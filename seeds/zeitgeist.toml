# GDELT DOC 2.0 timelines (coverage from 2017). Each query is wrapped with
# sourcecountry:BR; volume = share of monitored coverage, tone = avg tone.
[gdelt]
consultas = [
  "inflação",
  "desemprego",
  "corrupção",
  "impeachment",
  "reforma da previdência",
  "reforma tributária",
  "eleições",
  "fake news",
  "vacina",
  "desmatamento",
  "violência",
  "STF",
]
