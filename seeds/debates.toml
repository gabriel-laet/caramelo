# Election debates — hand-curated seed for `caramelo harvest debates`.
#
# Every entry is a debate *event*; `fontes` lists recordings of it (YouTube
# or any URL yt-dlp understands). Several mirrors are welcome: old uploads
# disappear, and `archive debates` tries them in order.
#
# status: "verificar" until date/broadcaster/participants are checked
# against a primary source (TSE, broadcaster archive, press of the day);
# then "ok". Participants are names as the candidates ran (nome de urna);
# they are resolved to TSE sq_candidato later.
#
# id convention: <ano>-<cargo>-<uf>-t<turno>-<emissora-slug>[-n]

