[project]
name = "caramelo-br"
version = "0.1.0"
description = "Canonical open-source data layer for Brazilian public data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.optional-dependencies]
publish = ["boto3>=1.34"]

[project.scripts]
caramelo = "caramelo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caramelo"]
