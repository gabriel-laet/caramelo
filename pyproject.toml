[project]
name = "caramelo-br"
version = "0.1.0"
description = "Canonical open-source data layer for Brazilian public data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.optional-dependencies]
# duckdb: cnpj harvester and llm enrichment run inside run-all
publish = ["boto3>=1.34", "duckdb>=1.0"]
transcribe = [
    "faster-whisper>=1.1",
    "yt-dlp[default,curl-cffi]>=2026.1",
    # CUDA runtime for CTranslate2 without a system CUDA install
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]
api = ["duckdb>=1.0", "fastapi>=0.115", "uvicorn>=0.30", "fastmcp>=3.0"]

[project.scripts]
caramelo = "caramelo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caramelo"]
